services:
  postgres:
    image: postgres:18
    container_name: testpayment-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: testpayment-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    container_name: testpayment-migrate
    env_file:
      - .env
    command: [ "uv", "run", "alembic", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: testpayment-api
    env_file:
      - .env
    command: [ "uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build: .
    container_name: testpayment-outbox-publisher
    env_file:
      - .env
    command: [ "uv", "run", "python", "-m", "src.infrastructure.messaging.outbox_publisher" ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-consumer:
    build: .
    container_name: testpayment-consumer
    env_file:
      - .env
    command: [ "uv", "run", "python", "-m", "src.infrastructure.messaging.payment_consumer" ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
